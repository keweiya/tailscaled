#!/system/bin/sh
# Central settings for the tailscaled module. Sourced by every script.
# Copied to /data/adb/tailscale/settings.ini on install, so local edits survive
# module updates.

export PATH="/data/adb/magisk:/data/adb/ksu/bin:$PATH"

# --- module -----------------------------------------------------------------
module_dir="/data/adb/modules/tailscaled"
module_prop="${module_dir}/module.prop"

# --- binaries ---------------------------------------------------------------
tailscale_dir="/data/adb/tailscale"
bin_dir="${tailscale_dir}/bin"

# One combined binary serves both the daemon and the CLI.
tailscale_bin="${bin_dir}/tailscale"
tailscaled_bin="${bin_dir}/tailscaled"
# Known-good copy + checksum. `tailscale update` downloads the OFFICIAL upstream
# binary, which is built for GOOS=linux: it activates Tailscale's osrouter (ip
# rules, fwmark 0x80000, `lookup main`, ts-* iptables chains) which cannot work
# on Android and blocks the link. The service restores this copy instead.
tailscaled_bin_pristine="${bin_dir}/tailscaled.orig"
tailscaled_bin_sum="${bin_dir}/tailscaled.sha256"

tailscale_bin_param="--socket=${tailscale_dir}/run/tailscaled.sock"
tailscaled_bin_param="-verbose=0 -statedir=${tailscale_dir}/run -state=${tailscale_dir}/run/tailscaled.state -socket=${tailscale_dir}/run/tailscaled.sock"

# --- run dirs / logs --------------------------------------------------------
tailscaled_run_dir="${tailscale_dir}/run"
tailscaled_scripts_dir="${tailscale_dir}/scripts"
tailscaled_log="${tailscaled_run_dir}/tailscaled.log"
tailscaled_pid="${tailscaled_run_dir}/tailscaled.pid"
tailscaled_runs_log="${tailscaled_run_dir}/runs.log"
tailscaled_service_log="${tailscaled_run_dir}/service.log"
tailscaled_diag_log="${tailscaled_run_dir}/diag.log"

# --- services ---------------------------------------------------------------
tailscaled_service="${tailscaled_scripts_dir}/tailscaled.service"
tailscaled_inotify="${tailscaled_scripts_dir}/tailscaled.inotify"

# --- routing ----------------------------------------------------------------
# A GOOS=android tailscaled has no osrouter, so it installs no routes at all.
# We install the minimum ourselves: every prefix listed in $tailscale_routes_file
# is sent to the TUN device through a private table, selected by destination.
# Only those destinations are touched, so a proxy (Surfing/Clash) keeps working.
# Edit /data/adb/tailscale/routes and run: tailscaled.service restart
tailscale_routes_file="${tailscale_dir}/routes"
# Subnet routes discovered from the tailnet are written here (machine-managed,
# rewritten by 'tailscaled.service routes-sync'). route_prefixes() returns the
# union of both files, so hand-written entries are never clobbered.
tailscale_routes_auto_file="${tailscale_dir}/routes.auto"
# Discover advertised subnets on start and periodically. Set to 0 to disable.
sync_routes_auto=1
# How many watchdog ticks (15 s each) between automatic discoveries.
sync_every_ticks=4
tun_iface="tailscale0"
tun_table="1099"
tun_rule_pref="12000"

# --- logging ----------------------------------------------------------------
normal="\033[0m"
red="\033[1;31m"
green="\033[1;32m"
yellow="\033[1;33m"
blue="\033[1;34m"

log() {
  case $1 in
    Error)   color="${red}" ;;
    Warning) color="${yellow}" ;;
    Info)    color="${blue}" ;;
    *)       color="${green}" ;;
  esac
  message="$(date +'%Y-%m-%d %H:%M:%S') [$1]: $2"
  [ -t 1 ] && echo -e "${color}${message}${normal}"
  echo "${message}" >> "${tailscaled_runs_log}" 2>&1
}

# Append to the diagnostic log (and mirror into the runs log).
diag() {
  mkdir -p "${tailscaled_run_dir}" 2>/dev/null
  printf '%s %s\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$*" >> "${tailscaled_diag_log}" 2>/dev/null
  log Info "DIAG: $*"
}

setup_home() {
  home="/data/ssh/root"
  [ -d "${home}" ] || { mkdir -p "${home}"; chmod 700 "${home}"; }
  export HOME="${home}"
}
